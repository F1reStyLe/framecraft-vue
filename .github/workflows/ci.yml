name: Frontend CI and image

on:
  pull_request:
    branches:
      - main
      - prod
  push:
    branches:
      - main
      - prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

jobs:
  test:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build
        env:
          VITE_API_BASE_URL: /api
          VITE_AUTH_API_BASE_URL: /auth-api
        run: npm run build

  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_AUTH_API_BASE_URL=/auth-api
          tags: |
            ghcr.io/f1restyle/framecraft-vue:${{ github.sha }}
            ghcr.io/f1restyle/framecraft-vue:prod
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=framecraft-vue
          cache-to: type=gha,mode=max,scope=framecraft-vue
